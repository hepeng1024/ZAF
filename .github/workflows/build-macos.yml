name: Build macOS ZAF

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-macos:
    name: Build macOS ARM64 app
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up ARM64 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          architecture: arm64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            packaging/requirements-macos-build.txt

      - name: Confirm native Apple-silicon runner
        shell: bash
        run: |
          test "$(uname -s)" = "Darwin"
          test "$(uname -m)" = "arm64"
          test "$(python -c 'import platform; print(platform.machine())')" = "arm64"
          python --version

      - name: Check packaging inputs
        run: bash packaging/package_macos.sh --check-only

      - name: Install runtime and build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement packaging/requirements-macos-build.txt
          python -m PyInstaller --version

      - name: Test source imports and calculations
        run: |
          python -c 'import ZAF, ZAF_gui; print("ZAF imports: OK")'
          python -m unittest discover -s tests -v

      - name: Build and verify ZAF.app
        run: bash packaging/package_macos.sh

      - name: Upload macOS ARM64 ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ZAF-macOS-arm64
          path: packaging/release/macos/ZAF-macOS-arm64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
